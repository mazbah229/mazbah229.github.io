<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <!-- ======================================================
       INSTANT REDIRECT — change the URL below to your target
       ====================================================== -->
  <meta http-equiv="refresh" content="0; url=https://mazbah229.pro.bd/">
  <!-- ====================================================== -->

  <title>Redirecting…</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:ital@0;1&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:     #0a0a0f;
      --panel:  #111118;
      --border: #1e1e2e;
      --text:   #e2e2f0;
      --muted:  #5a5a78;
      --accent: #7c6af7;
      --glow:   rgba(124, 106, 247, 0.18);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* subtle grid */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 40px 40px;
      opacity: 0.35;
      pointer-events: none;
    }

    .card {
      position: relative;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 48px 56px;
      text-align: center;
      box-shadow: 0 0 60px var(--glow), 0 2px 20px rgba(0,0,0,0.6);
      animation: fadeIn 0.35s ease both;
    }

    /* glow ring */
    .card::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), transparent 60%);
      opacity: 0.25;
      pointer-events: none;
    }

    /* spinning ring */
    .ring {
      width: 56px;
      height: 56px;
      margin: 0 auto 28px;
      border-radius: 50%;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      animation: spin 0.8s linear infinite;
    }

    h1 {
      font-size: 0.78rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 8px;
    }

    p {
      font-size: 0.72rem;
      color: var(--muted);
      margin-bottom: 24px;
      font-style: italic;
    }

    .url-box {
      display: inline-block;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 18px;
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 0.04em;
      word-break: break-all;
    }

    .url-box span { color: var(--text); }

    .fallback {
      margin-top: 20px;
      font-size: 0.65rem;
      color: var(--muted);
    }
    .fallback a {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color 0.2s;
    }
    .fallback a:hover { border-color: var(--accent); }

    @keyframes spin    { to { transform: rotate(360deg); } }
    @keyframes fadeIn  { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  </style>
</head>
<body>

  <div class="card">
    <div class="ring"></div>
    <h1>Redirecting</h1>
    <p>You are being transported instantly</p>

    <div class="url-box" id="dest">→ <span>https://mazbah229.pro.bd/</span></div>

    <p class="fallback">
      Not moving? <a href="https://mazbah229.pro.bd/" id="link">Click here</a>
    </p>
  </div>

  <script>
    // ── Change this one variable and nowhere else ──
    const TARGET = "https://mazbah229.pro.bd/";
    // ──────────────────────────────────────────────

    // Sync the visible URL and fallback link
    document.querySelector('#dest span').textContent = TARGET;
    document.getElementById('link').href = TARGET;

    // 0 ms redirect (JS fires before paint; meta refresh is the true 0 ms hook)
    location.replace(TARGET);
  </script>

</body>
</html>
